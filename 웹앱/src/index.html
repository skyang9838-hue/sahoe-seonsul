<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬꼬의 첫 출근</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<?!= include('ui'); ?>
<?!= include('theme'); ?>
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- 상단 막대 -->
    <div id="hud" class="hide">
      <div id="hud-who"></div>
      <div id="hud-prog">
        <div class="slot" data-i="0"><span class="slot-name">마트</span><span class="stamp"></span></div>
        <div class="slot" data-i="1"><span class="slot-name">공장</span><span class="stamp"></span></div>
        <div class="slot" data-i="2"><span class="slot-name">회의실</span><span class="stamp"></span></div>
      </div>
      <div id="hud-right"><span id="save-state">저장됨</span><button id="btn-sound" class="icon-btn" aria-label="소리 끄기">🔊</button><span class="key-hint">Esc 수첩</span></div>
    </div>

    <!-- 게임 화면 -->
    <div id="world" class="hide">
      <div id="zone-bg"></div>
      <div id="actors"></div>
      <div id="fx-clouds" aria-hidden="true"></div>
      <div id="fx-light" aria-hidden="true"></div>
      <div id="zone-banner" aria-live="polite"></div>
      <div id="prompt" class="hide"></div>
      <div id="toast" class="hide"></div>
    </div>

    <!-- 대화창 -->
    <div id="dialogue" class="hide">
      <div id="dlg-portrait"></div>
      <div id="dlg-body">
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
      </div>
      <div id="dlg-next">Space ▶</div>
    </div>

    <!-- 평가 패널 -->
    <div id="panel" class="hide" role="dialog" aria-modal="true">
      <div id="panel-left">
        <div id="panel-inst" class="inst"></div>
        <div id="panel-res" class="res-head"></div>
        <div id="panel-scene" class="scene-ph"></div>
        <div id="panel-chapter" class="chapter-title"></div>
        <div id="panel-text" class="res-text"></div>
      </div>
      <div id="panel-right">
        <div id="panel-qs"></div>
        <div class="panel-btns">
          <button id="panel-done" class="btn primary">다 썼어요</button>
        </div>
      </div>
    </div>

    <!-- 수첩 -->
    <div id="notebook" class="hide" role="dialog" aria-modal="true">
      <div class="nb-head">
        <div class="nb-title">꼬꼬의 수첩</div>
        <div id="nb-tabs"></div>
        <div id="nb-blank"></div>
        <button id="nb-close" class="btn">닫기 (Esc)</button>
      </div>
      <div class="nb-body">
        <div id="nb-left"><div id="nb-inst" class="inst"></div><div id="nb-res" class="res-head"></div><div id="nb-chapter" class="chapter-title"></div><div id="nb-text" class="res-text"></div></div>
        <div id="nb-right"><div id="nb-qs"></div></div>
      </div>
      <div class="nb-foot">
        <span id="nb-note"></span>
        <button id="nb-submit" class="btn primary">제출하기</button>
      </div>
    </div>

    <!-- 시작 -->
    <div id="sc-start" class="screen">
      <div class="title-art"><div class="hero-ph bob"></div></div>
      <h1 class="game-title">꼬꼬의 첫 출근</h1>
      <div class="sub">6학년 사회 서·논술형 평가</div>
      <div class="start-form">
        <label>6학년 <input id="in-ban" inputmode="numeric" maxlength="2" autocomplete="off"> 반</label>
        <label><input id="in-num" inputmode="numeric" maxlength="2" autocomplete="off"> 번</label>
        <label>이름 <input id="in-name" maxlength="10" autocomplete="off"></label>
      </div>
      <div id="start-msg" class="msg"></div>
      <button id="btn-start" class="btn primary big">출근하기</button>
    </div>

    <!-- 조작 안내 -->
    <div id="sc-guide" class="screen hide">
      <div class="guide-card">
        <h2>이렇게 움직여요</h2>
        <div class="keys">
          <div><span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">←</span><span class="kbd">→</span> 걷기</div>
          <div><span class="kbd wide">Space</span> 점프! · 가까이 가면 말 걸기 · 들어가기</div>
          <div><span class="kbd">Esc</span> 꼬꼬의 수첩 열기</div>
        </div>
        <p class="guide-note">평가는 장소 안에서 써요. 걷기는 짧게!</p>
        <div class="guide-go">Space를 누르면 시작해요</div>
      </div>
    </div>

    <!-- 끝 -->
    <div id="sc-end" class="screen hide">
      <div class="end-book">
        <div class="end-stamps"><span class="stamp on"></span><span class="stamp on"></span><span class="stamp on"></span></div>
        <div class="end-title">꼬꼬의 수첩 완성!</div>
        <div class="end-sub">제출 완료! 선생님 화면을 기다려 주세요.</div>
        <div id="end-time" class="end-time"></div>
        <button id="end-view" class="btn">내 답 다시 보기</button>
      </div>
    </div>

    <!-- 확인 창 -->
    <div id="ask" class="hide" role="alertdialog" aria-modal="true">
      <div class="ask-box">
        <div id="ask-msg"></div>
        <div class="ask-btns"><button id="ask-no" class="btn">돌아가기</button><button id="ask-yes" class="btn primary">네</button></div>
      </div>
    </div>

    <div id="banner" class="hide"><span id="banner-msg"></span><button id="banner-retry" class="btn">다시 저장</button></div>
  </div>
</div>
<?!= include('app'); ?>
</body>
</html>
