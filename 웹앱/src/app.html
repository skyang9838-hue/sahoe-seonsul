var SRV = (function () {
  var live = (typeof google !== "undefined" && google.script && google.script.run);
  if (live) {
    return {
      live: true,
      register: function (ban, num, name, ok, fail) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).register(ban, num, name);
      },
      save: function (p, ok, fail) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
          .saveAnswers(p.row, p.ban, p.num, p.name, p.answers, p.isFinal, p.progress);
      }
    };
  }
  // 로컬 미리보기 전용. 배포된 웹앱에서는 실행되지 않는다.
  var stub = { failNext: 0, rows: {}, calls: [], delay: 120 };
  try { stub.rows = JSON.parse(localStorage.getItem("kkokko-preview-server") || "{}"); } catch (e) {}
  window.__stub = stub;
  function later(fn) { setTimeout(fn, stub.delay); }
  function keep() { try { localStorage.setItem("kkokko-preview-server", JSON.stringify(stub.rows)); } catch (e) {} }
  return {
    live: false,
    register: function (ban, num, name, ok, fail) {
      later(function () {
        if (stub.failNext > 0) { stub.failNext--; fail(new Error("stub register fail")); return; }
        var k = [ban, num, name].join("/");
        if (!stub.rows[k]) stub.rows[k] = { row: Object.keys(stub.rows).length + 2, answers: blank(), submitted: false, submittedAt: "", progress: 0 };
        keep();
        var r = stub.rows[k];
        ok({ ok: true, row: r.row, answers: r.answers.slice(), submitted: r.submitted, submittedAt: r.submittedAt, progress: r.progress });
      });
    },
    save: function (p, ok, fail) {
      stub.calls.push(JSON.parse(JSON.stringify(p)));
      later(function () {
        if (stub.failNext > 0) { stub.failNext--; fail(new Error("stub save fail")); return; }
        if (stub.okFalse > 0) { stub.okFalse--; ok({ ok: false, msg: "저장하지 못했어요. (스텁)" }); return; }
        var r = stub.rows[[p.ban, p.num, p.name].join("/")];
        if (r && !r.submitted) {
          r.answers = p.answers.slice(); r.progress = Math.max(r.progress, p.progress);
          if (p.isFinal) { r.submitted = true; r.submittedAt = stamp(new Date()); }
        }
        keep();
        ok({ ok: true, at: stamp(new Date()), submitted: r ? r.submitted : false });
      });
    }
  };
})();

function lsKey() { return "kkokko:" + [S.ban, S.num, S.name].join(":"); }
function lsSave() {
  try { localStorage.setItem(lsKey(), JSON.stringify({ answers: S.answers, pending: S.dirty, progress: S.progress, flags: S.flags, base: S.base })); } catch (e) {}
}
function lsLoad() { try { var v = localStorage.getItem(lsKey()); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

function setAnswer(i, v) {
  if (S.submitted || S.finalizing) return;
  if (S.answers[i] === v) return;
  S.answers[i] = v; S.dirty = true; lsSave(); renderSaveState();
}

var saveQueue = [];
function save(isFinal, done) {
  if (S.saving) { saveQueue.push({ f: isFinal, d: done }); return; }
  if (!S.row) { if (done) done(false); return; }
  var snapshot = S.answers.slice();
  S.saving = true; renderSaveState();
  var tries = 0;
  function attempt() {
    tries++;
    SRV.save({ row: S.row, ban: S.ban, num: S.num, name: S.name, answers: snapshot, isFinal: !!isFinal, progress: S.progress },
      function (res) {
        S.saving = false;
        if (res && res.ok) {
          S.dirty = JSON.stringify(S.answers) !== JSON.stringify(snapshot);
          S.failed = false; S.lastSavedAt = hhmm(new Date()); S.base = JSON.stringify(snapshot);
          if (res.submitted) { S.submitted = true; S.submittedAt = res.at || stamp(new Date()); }
          lsSave(); hide("banner");
        } else { S.failed = true; showBanner(res && res.msg); }
        renderSaveState();
        if (done) done(!!(res && res.ok));
        drain();
      },
      function () {
        if (tries < 3) { setTimeout(attempt, 700 * tries); return; }
        S.saving = false; S.failed = true; renderSaveState(); showBanner(null);
        if (done) done(false);
        drain();
      });
  }
  attempt();
}
function drain() { if (saveQueue.length) { var j = saveQueue.shift(); save(j.f, j.d); } }
function showBanner(msg) {
  $("banner-msg").textContent = msg || "답을 서버에 저장하지 못했어요. 답은 이 컴퓨터에 남아 있으니 선생님께 알려 주세요.";
  show("banner");
}
function renderSaveState() {
  var el = $("save-state");
  el.className = S.saving ? "saving" : (S.failed ? "fail" : "");
  el.textContent = S.saving ? "저장 중…" : S.failed ? "저장 실패" : S.dirty ? "저장 대기" : (S.lastSavedAt ? "저장됨 " + S.lastSavedAt : "저장됨");
}
setInterval(function () { if (S.row && S.dirty && !S.saving && !S.submitted) save(false); }, 60000);
window.addEventListener("beforeunload", function (e) {

});

  var h = "", ro = S.submitted ? " readonly" : "";
  if (c === 0) {
    h += '<div class="q"><div class="q-prompt">' + esc(Q1.prompt) + '</div>';
    Q1.rows.forEach(function (lab, i) {
      h += '<div class="q-row"><span class="lab">' + esc(lab) + '</span><input id="' + prefix + 'a' + i + '" data-i="' + i + '" maxlength="120" autocomplete="off" spellcheck="false"' + ro + ' aria-label="' + esc(lab) + '"></div>';
    });
    h += '</div><div class="q"><div class="q-prompt">' + esc(Q2.prompt) + '</div>';
    Q2.lines.forEach(function (ln, j) {
      var idx = 2 + j;
      var pre = ln[0].slice(0, -1), post = ln[1].slice(0, 5), rest = ln[1].slice(5);
      h += '<div class="fill-line">' + esc(pre) + '<span class="nw">(<input id="' + prefix + 'a' + idx + '" data-i="' + idx + '" maxlength="20" autocomplete="off" spellcheck="false"' + ro + ' aria-label="2번 ' + (j === 0 ? "①" : "②") + ' 빈칸">' + esc(post) + '</span>' + esc(rest) + '</div>';
    });
    h += '</div>';
  } else {
    var Q = c === 1 ? Q3 : Q4, idx2 = c === 1 ? 4 : 5;
    h += '<div class="q"><div class="q-prompt">' + esc(Q.prompt) + '</div>';
    h += '<div class="cond">' + Q.cond.map(esc).join("<br>") + '</div>';
    h += '<textarea id="' + prefix + 'a' + idx2 + '" data-i="' + idx2 + '" maxlength="1500" rows="5" autocomplete="off" spellcheck="false"' + ro + ' aria-label="' + (c === 1 ? "3번" : "4번") + ' 답"></textarea></div>';
  }
  return h;
}
function bindInputs(root, prefix) {
  var els = root.querySelectorAll("input[data-i],textarea[data-i]");
  for (var k = 0; k < els.length; k++) (function (el) {
    var i = +el.getAttribute("data-i");
    el.value = S.answers[i] || "";
    function grow() { if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = Math.max(el.scrollHeight + 4, 118) + "px"; } }
    setTimeout(grow, 0);
    el.addEventListener("input", function () { setAnswer(i, el.value); grow(); });
    el.addEventListener("paste", function (e) { e.preventDefault(); toast("붙여넣기는 할 수 없어요. 직접 써 주세요."); });
    el.addEventListener("drop", function (e) { e.preventDefault(); });
    el.addEventListener("blur", function () { if (S.dirty && !S.saving) save(false); });
  })(els[k]);
}
function chapterBlank(c) {
  var idx = c === 0 ? [0, 1, 2, 3] : c === 1 ? [4] : [5], n = 0;
  idx.forEach(function (i) { if (!String(S.answers[i] || "").replace(/\s/g, "")) n++; });
  return n;
}

function openPanel(c) {
  curChapter = c;
  var sc = ART && ART.scenes && ART.scenes[c];
  if (sc) { $("panel-scene").innerHTML = '<img alt="' + esc(CHAPTERS[c].title) + ' 장면" src="' + sc + '">'; $("panel-scene").classList.add("has-art"); }
  else $("panel-scene").textContent = "(장면 그림 " + (c + 1) + ")";
  $("panel-inst").textContent = INSTRUCTION;
  $("panel-res").textContent = RESOURCE_TITLE;
  $("panel-chapter").textContent = CHAPTERS[c].title;
  $("panel-text").innerHTML = chapterHTML(c);
  $("panel-qs").innerHTML = qHTML(c, "p-");
  bindInputs($("panel-qs"), "p-");
  S.mode = "panel"; hide("prompt"); show("panel"); keys = {};
  var first = $("panel-qs").querySelector("input,textarea");
  focusAfterSpace = (first && !S.submitted) ? first : null;
  waitSpaceUp = !!spaceDown;
  if (!waitSpaceUp && focusAfterSpace) { var f0 = focusAfterSpace; focusAfterSpace = null; setTimeout(function () { f0.focus(); }, 50); }
}
function closePanel() {
  var c = curChapter;
  function leave() {
    hide("panel"); S.mode = "walk";
    if (document.activeElement) document.activeElement.blur();
    var firstTime = S.progress === c;
    if (firstTime) { S.progress = c + 1; lsSave(); }
    save(false);
    if (firstTime) {
      renderHUD(); popStamp(c); refreshDoors();
      var next = c === 0 ? "after1" : c === 1 ? "after2" : "after3";
      talk(DIALOGUE[next], function () { if (c === 2) openNotebook(0); });
    }
    flushTalk();
  }
  if (!S.submitted && chapterBlank(c) > 0) ask("비어 있는 칸이 있어요.\n나중에 수첩에서 다시 쓸 수 있어요. 나갈까요?", leave);
  else leave();
}

/* ─────────────────────────────────────────────
   12. 꼬꼬의 수첩 (검토·제출)
   ───────────────────────────────────────────── */

var nbTab = 0, nbPrev = "walk";
function openNotebook(tab) {
  if (S.mode === "notebook") return;
  nbPrev = (S.mode === "end") ? "end" : "walk";
  S.mode = "notebook"; hide("prompt"); show("notebook");
  renderNotebook(tab || 0);
}
function renderNotebook(tab) {
  nbTab = tab;
  var tabs = "";
  for (var c = 0; c < 3; c++) {
    var locked = S.progress < c + 1 && !S.submitted;
    tabs += '<button data-t="' + c + '" class="' + (c === tab ? "on" : "") + '"' + (locked ? " disabled" : "") + '>' + (c + 1) + "장" + '</button>';
  }
  $("nb-tabs").innerHTML = tabs;
  var btns = $("nb-tabs").querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) btns[i].addEventListener("click", function () { renderNotebook(+this.getAttribute("data-t")); });
  var visited = S.progress > tab || S.submitted;
  $("nb-inst").textContent = INSTRUCTION;
  $("nb-res").textContent = RESOURCE_TITLE;
  $("nb-chapter").textContent = CHAPTERS[tab].title;
  $("nb-text").innerHTML = visited ? chapterHTML(tab) : "<p>아직 들르지 않은 곳이에요.</p>";
  $("nb-qs").innerHTML = visited ? qHTML(tab, "n-") : "";
  if (visited) bindInputs($("nb-qs"), "n-");
  var blanks = 0; for (var k = 0; k < N_ANS; k++) if (!String(S.answers[k] || "").replace(/\s/g, "")) blanks++;
  $("nb-blank").textContent = S.submitted ? "" : (blanks ? "빈칸 " + blanks + "개" : "빈칸 없음");
  var canSubmit = S.progress >= 3 && !S.submitted;
  $("nb-submit").disabled = !canSubmit;
  $("nb-submit").classList.toggle("hide", S.submitted);
  $("nb-note").textContent = S.submitted ? "제출한 답이에요. 고칠 수 없어요." : (S.progress < 3 ? "세 곳을 모두 들러야 제출할 수 있어요." : "");
}
function closeNotebook() {
  if (S.finalizing) return;
  hide("notebook"); S.mode = nbPrev;
  if (nbPrev === "end") show("sc-end");
  if (document.activeElement) document.activeElement.blur();
  if (S.dirty && !S.saving) save(false);
  flushTalk();
}
function lockInputs(on) {
  var els = document.querySelectorAll("#panel input,#panel textarea,#notebook input,#notebook textarea");
  for (var i = 0; i < els.length; i++) els[i].readOnly = on || S.submitted;
}
function submitFinal() {
  var blanks = []; for (var k = 0; k < N_ANS; k++) if (!String(S.answers[k] || "").replace(/\s/g, "")) blanks.push(ANSWER_LABELS[k]);
  var msg = (blanks.length ? "비어 있는 칸: " + blanks.join(", ") + "\n\n" : "") + "제출하면 고칠 수 없어요. 제출할까요?";
  ask(msg, function () {
    $("nb-submit").disabled = true; S.finalizing = true; lockInputs(true);
    save(true, function (ok) {
      S.finalizing = false;
      if (ok && S.submitted) { hide("notebook"); showEnd(); sfx.done(); }
      else { $("nb-submit").disabled = false; lockInputs(false); }
    });
  });
}

/* ─────────────────────────────────────────────
   13. 확인 창
   ───────────────────────────────────────────── */

var askYes = null, askPrev = "", askFocus = null;
function ask(msg, yes) {
  askFocus = document.activeElement;
  askYes = yes; askPrev = S.mode; S.mode = "ask";
  $("ask-msg").textContent = msg; show("ask");
  setTimeout(function () { $("ask-no").focus(); }, 30);
}
function closeAsk(ok) {
  hide("ask"); S.mode = askPrev;
  var f = askYes; askYes = null;
  if (ok && f) f();
  else if (askFocus && askFocus.focus && document.body.contains(askFocus)) askFocus.focus();
  flushTalk();
}

/* ─────────────────────────────────────────────
   14. 시작·이어쓰기·끝
   ───────────────────────────────────────────── */

function start() {
  if ($("btn-start").disabled || S.mode !== "start") return;
  var ban = digits($("in-ban").value), num = digits($("in-num").value), name = $("in-name").value.replace(/^\s+|\s+$/g, "");
  if (!$("in-ban").value || !$("in-num").value || !name) { $("start-msg").textContent = "반, 번호, 이름을 모두 적어 주세요."; return; }
  if (!ban || !num) { $("start-msg").textContent = "반과 번호는 숫자로만 적어 주세요."; return; }
  $("btn-start").disabled = true; $("start-msg").textContent = "출근 준비 중…";
  SRV.register(ban, num, name, function (res) {
    $("btn-start").disabled = false;
    if (S.mode !== "start") return;
    if (!res || !res.ok) { $("start-msg").textContent = (res && res.msg) || "다시 눌러 주세요."; return; }
    S.ban = ban; S.num = num; S.name = name; S.row = res.row;
    S.submitted = !!res.submitted; S.submittedAt = res.submittedAt || "";
    S.answers = (res.answers || blank()).slice(0, N_ANS); while (S.answers.length < N_ANS) S.answers.push("");
    S.progress = res.progress || 0; S.base = JSON.stringify(S.answers);
    var local = lsLoad();
    if (local) {
      var serverJSON = JSON.stringify(S.answers), serverBlank = !S.answers.join("").replace(/\s/g, "");
      if (local.pending && !S.submitted && local.answers && (local.base === serverJSON || serverBlank)) { S.answers = local.answers.slice(0, N_ANS); S.dirty = true; }
      S.progress = Math.max(S.progress, local.progress || 0);
      S.flags = local.flags || {};
    }
    if (S.progress >= 2) S.flags.talkedBoss = true;
    if (S.progress >= 1) S.flags.talkedMom = true;
    if (S.progress >= 3) { S.flags.seeFox = S.flags.seeAd = S.flags.seeRiver = true; }
    $("start-msg").textContent = "";
    hide("sc-start");
    if (S.submitted) { showEnd(); return; }
    if (S.dirty) save(false);
    var fresh = S.progress === 0 && !String(S.answers.join("")).replace(/\s/g, "");
    if (fresh) { show("sc-guide"); S.mode = "guide"; }
    else enterWorld();
  }, function () {
    $("btn-start").disabled = false; $("start-msg").textContent = "서버와 연결하지 못했어요. 다시 눌러 주세요.";
  });
}

function enterWorld() {
  hide("sc-guide"); show("hud"); show("world");
  renderHUD(); renderSaveState();
  var z = Math.min(S.progress, 2);
  S.zone = z; buildZone(z);
  S.x = ZONES[z].start[0]; S.y = ZONES[z].start[1];
  camX = Math.max(0, Math.min(WORLD_W - ZW, S.x - ZW / 2));
  S.mode = "walk"; drawHero(0, false); zoneBanner(z);
  if (S.progress >= 3) openNotebook(0);
}

function showEnd() {
  S.mode = "end";
  hide("hud"); hide("world"); hide("dialogue"); hide("panel"); hide("notebook");
  $("end-time").textContent = S.submittedAt ? "제출 시각 " + S.submittedAt : "";
  show("sc-end");
}

/* ─────────────────────────────────────────────
   15. 키보드
   ───────────────────────────────────────────── */

var GAME_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, Space: 1 };
function typing() {
  var a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
}
document.addEventListener("keydown", function (e) {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.code === "Space") spaceDown = true;
  if (S.mode === "ask") {
    if (e.code === "Escape") { e.preventDefault(); closeAsk(false); }
    if (e.key === "Tab") { e.preventDefault(); (document.activeElement === $("ask-no") ? $("ask-yes") : $("ask-no")).focus(); }
    return;
  }
  if (S.mode === "panel" && waitSpaceUp && e.code === "Space") { e.preventDefault(); return; }
  if (e.code === "Escape") {
    if (S.mode === "notebook") { e.preventDefault(); closeNotebook(); return; }
    if (S.mode === "panel") { e.preventDefault(); return; }
    if (S.mode === "walk") { e.preventDefault(); openNotebook(Math.max(0, Math.min(S.progress, 3) - 1)); return; }
    return;
  }
  if (typing()) return;
  if (S.mode === "start") return;
  if (S.mode === "guide") { if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); enterWorld(); } return; }
  if (S.mode === "talk") { if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (!e.repeat) advance(); } return; }
  if (S.mode === "walk") {
    if (GAME_KEYS[e.code]) e.preventDefault();
    if (e.code === "Space" && !e.repeat) { if (nearest()) interact(); else jump(); return; }
    keys[e.code] = true;
  }
});
document.addEventListener("keyup", function (e) {
  keys[e.code] = false;
  if (e.code === "Space") {
    spaceDown = false;
    if (waitSpaceUp) { waitSpaceUp = false; if (focusAfterSpace) { focusAfterSpace.focus(); focusAfterSpace = null; } }
  }
});
window.addEventListener("blur", function () { keys = {}; });

$("btn-start").addEventListener("click", start);
function renderSound() { $("btn-sound").textContent = SND.on ? "🔊" : "🔈"; $("btn-sound").setAttribute("aria-label", SND.on ? "소리 끄기" : "소리 켜기"); }
$("btn-sound").addEventListener("click", function () { SND.on = !SND.on; try { localStorage.setItem("kkokko-sound", SND.on ? "on" : "off"); } catch (e) {} renderSound(); this.blur(); });
renderSound();
if (ART && ART.zones) { $("sc-start").style.backgroundImage = "linear-gradient(rgba(255,248,236,.25),rgba(255,248,236,.55)),url(" + ART.zones[0] + ")"; $("sc-start").classList.add("has-art"); }
if (ART && ART.chars && ART.chars.kkokko) { var ta = document.querySelector("#sc-start .title-art"); ta.innerHTML = '<div class="title-hero bob">' + ph("kkokko", "happy") + '</div>'; }
["in-ban", "in-num", "in-name"].forEach(function (id) {
  $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
});
$("panel-done").addEventListener("click", closePanel);
$("nb-close").addEventListener("click", closeNotebook);
$("nb-submit").addEventListener("click", submitFinal);
$("ask-yes").addEventListener("click", function () { closeAsk(true); });
$("ask-no").addEventListener("click", function () { closeAsk(false); });
$("banner-retry").addEventListener("click", function () { save(false); });
$("end-view").addEventListener("click", function () { hide("sc-end"); openNotebook(0); });

if (reduceMotion) document.body.classList.add("reduce");
fit();
requestAnimationFrame(loop);
setTimeout(function () { $("in-ban").focus(); }, 50);

// 검사용 (tools/test): 상태를 들여다본다. 게임 진행에는 쓰지 않는다.
window.__kk = { S: S, ZONES: ZONES };
})();
</script>
